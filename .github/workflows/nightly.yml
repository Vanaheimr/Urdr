name: Nightly

# Scheduled workflows run on the default branch. GitHub may disable the
# schedule after 60 days without repository activity; workflow_dispatch keeps
# the same job available for manual runs.
on:
  schedule:
    # Avoid the busy top-of-the-hour window used by many scheduled workflows.
    - cron: '17 2 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-suite:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            leg: windows-latest
          - os: ubuntu-latest
            container: debian:13
            leg: debian-13-container
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}

    steps:
      - uses: actions/checkout@v7
        with:
          path: Urdr

      # Urdr cannot be built on its own any more: its TSA client uses Hermod's HTTP client, so
      # that the TSA's host name is resolved with a DNS client and not by the operating system,
      # and Urdr.csproj references ..\..\Hermod\... - a SIBLING directory, which references
      # Styx the same way. Both are checked out alongside, as ChargyCore.NET does; neither is
      # pinned, so a breaking change on their master turns this red.
      - uses: actions/checkout@v7
        with:
          repository: Vanaheimr/Styx
          path: Styx

      - uses: actions/checkout@v7
        with:
          repository: Vanaheimr/Hermod
          path: Hermod

      - name: Install .NET and test prerequisites (Debian container)
        if: runner.os == 'Linux'
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl libicu76 libssl3t64 libstdc++6 openssl tzdata

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Verify OpenSSL
        run: openssl version

      - name: Build
        working-directory: Urdr
        run: dotnet build Urdr.slnx --configuration Release

      - name: Test full suite
        working-directory: Urdr
        timeout-minutes: 60
        run: dotnet test UrdrTests/UrdrTests.csproj --configuration Release --no-build --logger "console;verbosity=normal" --logger "trx;LogFileName=${{ matrix.leg }}.trx" --results-directory artifacts

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.leg }}
          path: Urdr/artifacts/*.trx

